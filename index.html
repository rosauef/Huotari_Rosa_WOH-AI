<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
        
        body {
            text-align: center; 
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <p id="scoreInfo">Score: 0</p>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>
    <!--lisätään nappi, jolla voidaan aloittaa uusi peli: -->
    <button id="restartButton">Restart</button>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const info = document.getElementById("info");
        const scoreInfo = document.getElementById("scoreInfo");

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

        const updateGame = () => {
            const head = snake[0];

            // lasketaan uudeen pään sijainti:
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            // tarkistetaan, osuuko käärmeen pää seinään tai itseensä:
            if (newHead.x < 0 || 
                newHead.x >= tileCount || 
                newHead.y < 0  || 
                newHead.y >= tileCount
                ){
                info.textContent = "Game Over!";
                clearInterval(gameLoop);
                return;
                }
            
            const hitSelf = snake.some(segment => {
                return segment.x === newHead.x && segment.y === newHead.y;
            });

            if (hitSelf) {
                info.textContent = "Game Over!";
                clearInterval(gameLoop);
                return;
            }

            // lisätään uusi pää snake-taulukon alkuun:
            snake.unshift(newHead);

            // tarkistetaan, osuuko pää ruokaan ja kasvatetaan käärmeen pituutta, jos se osuu ruokaan:
            if (newHead.x === food.x && newHead.y === food.y) {
                console.log("Ruoka syötiin!");
                score++;
                scoreInfo.textContent = "Score: " + score;

                // luodaan uusi ruoka satunnaiseen paikkaan:
                food = {
                    // Math.random() antaa satunnaisen desimaaliluvun väliltä 0-1
                    // kun tämä satunnainen luku kerrotaan * tileCount, satunnainen arvo on väliltä 0-19
                    // Math.floor pyöristää alaspäin kokonaisluvuksi
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

            } else {
            // poistetaan viimeinen segmentti snake-taulukosta, jos käärme ei ole syönyt ruokaa:
            snake.pop();
            }

            // piirretään peli uudelleen:
            drawGame();
        };
        
        // kutsutaan updateGame-funktiota 200 millisekunnin välein:
        let gameLoop = setInterval(updateGame, 200);
        
        // lisätään näppäimistön kuuntelija, joka tulostaa konsoliin painetun näppäimen:
        document.addEventListener("keydown", (event) => {
            console.log(event.key);

            //muutetaan direction-muuttujaa nuolinäppäimen painalluksen mukaan:
            if (event.key === "ArrowUp" && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            } else if (event.key === "ArrowDown" && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            } else if (event.key === "ArrowLeft" && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            } else if (event.key === "ArrowRight" && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            }
        });

        // luodaan funktio, joka aloittaa uuden pelin:
        const startNewGame = () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 } 
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            scoreInfo.textContent = "Score: " + score;
            info.textContent = "";
            drawGame();
            gameLoop = setInterval(updateGame, 200);
        };

        // yhdistetään restartButton-nappiin tapahtumankuuntelija, joka aloittaa uuden pelin:
        const restartButton = document.getElementById("restartButton");
        restartButton.addEventListener("click", startNewGame);        

    </script>

</body>
</html>
